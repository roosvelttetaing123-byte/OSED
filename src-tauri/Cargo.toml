[package]
name = "osed-forge"
version = "0.4.0"
description = "OSED Forge offline study companion"
authors = ["OSED Forge contributors"]
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
rfd = "0.15"
open = "5"
[profile.release]
lto = true
codegen-units = 1
strip = true
