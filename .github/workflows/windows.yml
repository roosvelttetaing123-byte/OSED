name: Windows application
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'src-tauri/**', 'scripts/**', 'labs/**', 'tests/**', 'package.json', '.github/workflows/windows.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test original learning engine
        run: npm test
      - name: Prepare assets and desktop toolchain
        run: |
          python scripts/icon.py
          npm install --ignore-scripts
          rustup update stable
          rustup default stable
      - name: Test transactional storage
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Build Windows executable and installer
        run: npm run desktop:build
      - name: Compile original 32-bit practice targets
        shell: cmd
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          call labs\build.cmd
      - name: Install and smoke-test persistence and real WebView startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (!$installer) { throw 'Installer missing' }
          $p = Start-Process $installer.FullName -ArgumentList '/S' -PassThru
          if (!$p.WaitForExit(180000)) { $p.Kill(); throw 'Installer timeout' }
          if ($p.ExitCode -ne 0) { throw "Installer failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'OSED Forge/osed-forge.exe'
          if (!(Test-Path $exe)) { throw "Installed EXE missing: $exe" }
          foreach ($mode in @('--smoke-test','--ui-smoke-test')) {
            $p = Start-Process $exe -ArgumentList $mode -PassThru
            if (!$p.WaitForExit(120000)) { $p.Kill(); throw "Application timeout: $mode" }
            if ($p.ExitCode -ne 0) { throw "Application failed: $mode exit $($p.ExitCode)" }
          }
      - name: Package downloads and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release
          Copy-Item 'src-tauri/target/release/bundle/nsis/*-setup.exe' 'release/OSED-Forge-Setup.exe'
          Copy-Item 'src-tauri/target/release/osed-forge.exe' 'release/OSED-Forge.exe'
          Compress-Archive -Path 'labs/*' -DestinationPath 'release/OSED-Forge-Foundation-Labs.zip'
          python scripts/package.py
          (Get-ChildItem release -File | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" }) | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OSED-Forge-Windows
          path: release/*
          if-no-files-found: error
      - name: Publish downloadable prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = (Get-ChildItem release -File).FullName
          gh release create "v0.2.0-build.${{ github.run_number }}" @assets --target "${{ github.sha }}" --title "OSED Forge 0.2.0 - Windows build ${{ github.run_number }}" --prerelease --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
